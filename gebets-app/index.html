<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gebetszeiten</title>
<meta name="description" content="Gebetszeiten, Kıble-Kompass, Erinnerungen und Gebets-Tracker">
<meta name="theme-color" content="#06130E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gebet">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="stylesheet" href="app.css">
<script>
// ===== SiTech Glas – Hell/Dunkel-Schalter (Stand 07.10.2026) =====
// Quelle: C:\Users\yasin\Claude\Gemeinsam\Design\SiTech-Glas\sitech-glas-theme.js
// Gehört als <script> direkt hinter den <style>-Block im <head> (setzt das Thema,
// bevor die Seite gezeichnet wird – kein Aufblitzen). Der Knopf ist ein Element mit
// id="sgSchalter" und onclick="sgThemeUmschalten()". Gemerkt wird die Wahl im
// localStorage ("sitech_theme"), ohne Wahl gilt die Einstellung des Geräts.
(function () {
  var K = "sitech_theme";
  function gespeichert() { try { return localStorage.getItem(K) || ""; } catch (e) { return ""; } }
  function aktuell() {
    var s = gespeichert();
    if (s === "light" || s === "dark") return s;
    return window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  }
  function setzen(t) {
    document.documentElement.setAttribute("data-theme", t);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.content = t === "light" ? "#F4EFDF" : "#06130E";
    var b = document.getElementById("sgSchalter");
    if (b) { b.textContent = t === "light" ? "🌙" : "☀️"; b.title = t === "light" ? "Dunkle Ansicht" : "Helle Ansicht"; }
  }
  window.sgThemeUmschalten = function () {
    var n = aktuell() === "dark" ? "light" : "dark";
    try { localStorage.setItem(K, n); } catch (e) {}
    setzen(n);
  };
  setzen(aktuell());
  document.addEventListener("DOMContentLoaded", function () { setzen(aktuell()); });
  if (window.matchMedia) matchMedia("(prefers-color-scheme: light)").addEventListener("change", function () { if (!gespeichert()) setzen(aktuell()); });
})();
</script>
</head>
<body>
<header class="kopf">
  <div>
    <div class="ort" id="ortName">…</div>
    <div class="datum" id="datumText"></div>
    <div class="hidschri" id="hidschriText"></div>
  </div>
  <div class="tagwahl">
    <button id="tagZurueck" data-t-aria="kopf.zurueck" aria-label="Vorheriger Tag">‹</button>
    <button id="tagHeute" data-t="kopf.heute">Heute</button>
    <button id="tagVor" data-t-aria="kopf.vor" aria-label="Nächster Tag">›</button>
    <button type="button" id="sprachSchalter" class="sg-schalter sg-inline sprache" data-t-title="kopf.sprache">TR</button>
    <button type="button" id="sgSchalter" class="sg-schalter sg-inline" onclick="sgThemeUmschalten()">☀️</button>
  </div>
</header>
<div class="zierleiste" aria-hidden="true"></div>

<main>
  <!-- ZEITEN -->
  <section id="tab-zeiten" class="seite aktiv">
    <div class="naechstes" id="naechstesKarte">
      <div class="klein" data-t="z.naechstes">Nächstes Gebet</div>
      <div class="gross" id="naechstesName">–</div>
      <div class="arabisch" id="naechstesAr" lang="ar" dir="rtl"></div>
      <div class="zeit" id="naechstesZeit">–</div>
      <div class="rest" id="naechstesRest">–</div>
    </div>
    <ul class="liste" id="zeitenListe"></ul>
    <div class="kartentext hadith" id="hadithKarte"></div>
    <p class="hinweis" id="rechenHinweis"></p>
  </section>

  <!-- KIBLE -->
  <section id="tab-kible" class="seite">
    <div class="kompass" id="kompass">
      <svg viewBox="-110 -110 220 220" aria-hidden="true">
        <circle r="104" class="k-ring"/>
        <g id="kompassRose">
          <text y="-86" class="k-n">N</text>
          <text x="86" class="k-w" id="kO">O</text>
          <text y="94" class="k-w">S</text>
          <text x="-86" class="k-w" id="kW">W</text>
          <g class="k-striche"></g>
        </g>
        <g id="kibleZeiger">
          <polygon points="0,-92 11,-60 0,-68 -11,-60" class="k-pfeil"/>
          <line x1="0" y1="-60" x2="0" y2="30" class="k-linie"/>
          <circle cy="46" r="7" class="k-pfeil"/>
        </g>
        <circle r="4" class="k-mitte"/>
      </svg>
    </div>
    <div class="kible-info">
      <div class="gross" id="kibleGrad">–</div>
      <div id="kibleText" class="klein"></div>
    </div>
    <button class="knopf" id="kompassStart" data-t="k.kompassStart">Kompass einschalten</button>
    <p class="hinweis" id="kibleHinweis" data-t="k.hinweis"></p>
  </section>

  <!-- KALENDER -->
  <section id="tab-kalender" class="seite">
    <div class="monatskopf">
      <button id="kalZurueck" data-t-aria="c.vorMonat" aria-label="Vorheriger Monat">‹</button>
      <div class="monatsname">
        <div class="gross" id="kalMonat">–</div>
        <div class="klein" id="kalHidschri"></div>
      </div>
      <button id="kalVor" data-t-aria="c.nachMonat" aria-label="Nächster Monat">›</button>
    </div>
    <div class="kalraster" id="kalKopf"></div>
    <div class="kalraster" id="kalRaster"></div>
    <button class="knopf zweit kleinknopf" id="kalHeute" data-t="c.heute">Heute</button>
    <div class="kartentext" id="kalDetail"></div>
    <h2 data-t="c.kommend">Kommende religiöse Tage</h2>
    <ul class="liste kommend" id="kalKommend"></ul>
    <p class="hinweis" data-t="c.hinweis"></p>
  </section>

  <!-- TRACKER -->
  <section id="tab-tracker" class="seite">
    <div class="kacheln">
      <div class="kachel"><div class="gross" id="trkHeute">0/5</div><div class="klein" data-t="t.heute">heute</div></div>
      <div class="kachel"><div class="gross" id="trkSerie">0</div><div class="klein" data-t="t.serie">Tage in Folge</div></div>
      <div class="kachel"><div class="gross" id="trkWoche">0%</div><div class="klein" data-t="t.woche">letzte 7 Tage</div></div>
    </div>
    <div class="raster" id="trkRaster"></div>
    <p class="hinweis" data-t="t.hinweis"></p>
  </section>

  <!-- EINSTELLUNGEN -->
  <section id="tab-einstellungen" class="seite">
    <h2 data-t="e.sprache">Sprache</h2>
    <div class="sprachwahl">
      <button type="button" class="knopf zweit" data-sprache="de">Deutsch</button>
      <button type="button" class="knopf zweit" data-sprache="tr">Türkçe</button>
    </div>

    <h2 data-t="e.titel">Diyanet-Zeiten (Wahl)</h2>
    <p class="hinweis" data-t="e.diyanetText"></p>
    <label class="feld"><span data-t="e.land">Land</span> <select id="dLand"><option value="" data-t="e.landLaden">Antippen zum Laden</option></select></label>
    <label class="feld"><span data-t="e.stadt">Stadt</span> <select id="dStadt"><option value="" data-t="e.stadtWaehlen">Stadt wählen</option></select></label>
    <label class="feld"><span data-t="e.ort">Ort</span> <select id="dOrt"><option value="" data-t="e.ortWaehlen">Ort wählen</option></select></label>
    <p class="hinweis" id="dStatus"></p>
    <button class="knopf zweit" id="dEntfernen" style="display:none" data-t="e.diyanetEntfernen"></button>

    <h2 data-t="e.standort">Standort (Kıble und Rückfall)</h2>
    <label class="feld"><span data-t="e.stadtFeld">Stadt</span>
      <select id="ortAuswahl"></select>
    </label>
    <button class="knopf zweit" id="gpsKnopf" data-t="e.gps">📍 Meinen Standort verwenden</button>
    <p class="hinweis" id="gpsHinweis"></p>

    <h2 data-t="e.erinnerung">Erinnerung</h2>
    <label class="feld"><span data-t="e.wieFrueh">Wie früh?</span>
      <select id="vorlauf"></select>
    </label>
    <div class="schalter-liste" id="erinnerungGebete"></div>
    <button class="knopf" id="pushKnopf">🔔</button>
    <p class="hinweis" id="pushHinweis"></p>

    <h2 data-t="e.fein">Zeiten feinabstimmen</h2>
    <p class="hinweis" data-t="e.feinText"></p>
    <div class="minuten" id="minutenFelder"></div>
    <button class="knopf zweit" id="minutenZurueck" data-t="e.feinZurueck">Auf 0 zurücksetzen</button>

    <h2 data-t="e.ueber">Über</h2>
    <p class="hinweis" data-t="e.ueberText"></p>
  </section>
</main>

<nav class="leiste">
  <button data-tab="zeiten" class="aktiv"><span>🕌</span><i data-t="nav.zeiten">Zeiten</i></button>
  <button data-tab="kible"><span>🧭</span><i data-t="nav.kible">Kıble</i></button>
  <button data-tab="kalender"><span>🌙</span><i data-t="nav.kalender">Kalender</i></button>
  <button data-tab="tracker"><span>✅</span><i data-t="nav.tracker">Tracker</i></button>
  <button data-tab="einstellungen"><span>⚙️</span><i data-t="nav.mehr">Mehr</i></button>
</nav>

<div id="toast" class="toast" role="status"></div>
<script type="module" src="app.js"></script>
</body>
</html>
